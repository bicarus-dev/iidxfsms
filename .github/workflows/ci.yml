name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MinGW x64 Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build toolchain image
        run: docker build --pull --tag iidxfsms-build docker

      - name: Build DLL
        env:
          BUILD_TYPE: Release
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src" \
            --workdir /src \
            --env BUILD_TYPE \
            --env BUILD_ROOT=/tmp/iidxfsms-build \
            iidxfsms-build bash /src/build_all.sh
          test -s bin/iidxfsms/iidxfsms.dll
          test -s bin/iidxfsms/iidxfsms.ini

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iidxfsms-x64-Release
          path: |
            bin/iidxfsms/iidxfsms.dll
            bin/iidxfsms/iidxfsms.ini
          if-no-files-found: error
          retention-days: 30