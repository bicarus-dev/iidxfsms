name: Draft Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Draft Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release name
        run: |
          tag=$(date -u +'%y-%m-%d')
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=iidxfsms-$tag" >> "$GITHUB_ENV"

      - name: Build toolchain image
        run: docker build --pull --tag iidxfsms-build docker

      - name: Build DLL
        env:
          BUILD_TYPE: Release
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src" \
            --workdir /src \
            --env BUILD_TYPE \
            --env BUILD_ROOT=/src/build-release \
            iidxfsms-build bash /src/build_all.sh
          test -s bin/iidxfsms/iidxfsms.dll
          test -s bin/iidxfsms/iidxfsms.ini

      - name: Package
        run: |
          mkdir -p dist/iidxfsms/licenses
          cp bin/iidxfsms/iidxfsms.dll bin/iidxfsms/iidxfsms.ini dist/iidxfsms/
          cp README.md LICENSE THIRD_PARTY.md dist/iidxfsms/
          deps=build-release/cmake-build-release-mingw64/_deps
          cp "$deps/minhook-src/LICENSE.txt" dist/iidxfsms/licenses/MinHook.txt
          cp "$deps/simpleini-src/LICENCE.txt" dist/iidxfsms/licenses/SimpleIni.txt
          cp external/spice-sdk/LICENSE dist/iidxfsms/licenses/Spice-SDK.txt
          cd dist
          zip -r "$RELEASE_NAME.zip" iidxfsms

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: main
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/iidxfsms-*.zip