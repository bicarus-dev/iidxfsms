[iidxfsms]
; Set mode to one of these two words:
;   default = show the game's original FAST/SLOW text
;   ms      = show timing numbers, such as -8.3 ms or +8.3 ms
mode=ms

; Set show_pgreat to 1 or 0 (only used when mode=ms):
;   1 = also show timing numbers for PGREAT judgments
;   0 = do not show timing numbers for PGREAT judgments
show_pgreat=0

; Restart the game after changing these settings.